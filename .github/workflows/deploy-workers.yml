name: Deploy Cloudflare Workers

# Production deploys wait for a green CI run on main (OPT-1062). A push whose
# CI fails ships neither worker nor the effect-schema sync. Only a run for a
# green main push carries its CI commit in the run name;
# worker-deploy-changes.sh reads the newest successful one back as the base of
# the next diff, so a failed deploy's changes ship with the next green run.
# Keep this condition in step with the `changes` job's `if`.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && 'Sync effect schemas (manual)'
    || (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
      && format('Deploy workers for {0}', github.event.workflow_run.head_sha)
    || format('Skip workers deploy (CI {0}, {1})', github.event.workflow_run.conclusion, github.event.workflow_run.event) }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual runs execute only the schema sync (deploys stay CI-gated).
  # Useful to verify the sync end-to-end or re-sync after a DB import.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-workers-main
  cancel-in-progress: false

jobs:
  changes:
    # Only a successful CI run for a push to this repository's main branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.filter.outputs.game || 'false' }}
      images: ${{ steps.filter.outputs.images || 'false' }}
      schemas: ${{ steps.filter.outputs.schemas || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch tip by default, which
          # may be newer than the commit CI tested. Pin the tested commit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Decide what to deploy
        id: filter
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          DEPLOY_WORKFLOW: deploy-workers.yml
        run: bash .github/scripts/worker-deploy-changes.sh

  deploy-game:
    needs: [changes, sync-effect-schemas]
    if: >-
      always() &&
      github.event_name == 'workflow_run' &&
      needs.changes.outputs.game == 'true' &&
      (needs.changes.outputs.schemas != 'true' || needs.sync-effect-schemas.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Deploy game worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers/game

  # Card.effectSchema is a derived copy of the authored schemas in
  # workers/game/src/engine/schemas/ (see pipeline/sync-effect-schemas.ts).
  # Re-sync both Neon branches whenever the authored schemas or the sync
  # logic change, then verify with --check so drift fails the workflow.
  sync-effect-schemas:
    needs: changes
    if: >-
      needs.changes.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.schemas == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env-name: dev
            url-secret: DATABASE_URL_DEV
          - env-name: prod
            url-secret: DATABASE_URL_PROD
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Sync effect schemas (${{ matrix.env-name }})
        run: pnpm pipeline:sync-schemas
        env:
          DATABASE_URL: ${{ secrets[matrix.url-secret] }}
      - name: Verify no drift remains (${{ matrix.env-name }})
        run: pnpm pipeline:sync-schemas --check
        env:
          DATABASE_URL: ${{ secrets[matrix.url-secret] }}

  deploy-images:
    needs: changes
    if: github.event_name == 'workflow_run' && needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Deploy images worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers/images
